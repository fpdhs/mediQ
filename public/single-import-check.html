<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Medi Q | 단건 반입 검증</title>
<style>body{margin:0;background:#f4f7f8;color:#17252b;font:16px/1.6 system-ui,sans-serif}main{max-width:760px;margin:40px auto;padding:24px}h1{font-size:26px}section{padding:24px 0;border-top:1px solid #cbd6db}button,select{font:inherit;padding:10px 16px;border:1px solid #92a9b4;border-radius:6px}button{background:#126d92;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:default}select{display:block;width:100%;margin:12px 0;background:white}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:16px;border:1px solid #cbd6db;border-radius:6px;font-size:13px}label{display:block;margin:14px 0}a{color:#126d92}.status{color:#146748}@media(max-width:600px){main{margin:0;padding:20px}}</style>
</head><body><main><a href="/hipass/">Medi Q</a><h1>A → B 단건 반입 검증</h1><p>합성 복부 CT · 영상 2번 · 1건 · 비임상 시연</p>
<section><h2>환자 다운로드 동의</h2><button id="patient">환자 계정 로그인</button><select id="consent" aria-label="다운로드 허용 동의" disabled><option>로그인 후 선택</option></select><p id="scope"></p></section>
<section><h2>B병원 의료진</h2><button id="doctor">의료진 계정 로그인</button><p id="identity"></p><label><input id="confirm" type="checkbox"> 선택한 동의로 합성 영상 한 건을 B병원 PACS에 보관합니다.</label><button id="run" disabled>B병원 PACS로 1건 가져오기</button></section>
<p role="status" id="status">인증 대기</p><pre id="receipt" aria-label="반입 결과">NOT VERIFIED</pre><script type="module" src="/single-import-check.js"></script></main></body></html>
