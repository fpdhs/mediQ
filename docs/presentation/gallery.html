<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medi Q 시연 스크린샷 갤러리 (24종)</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-card: #334155;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border: #475569;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: var(--bg-secondary);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-badge {
      background: rgba(56, 189, 248, 0.2);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      border: 1px solid rgba(56, 189, 248, 0.4);
    }
    .filters {
      display: flex;
      gap: 6px;
    }
    .filter-btn {
      background: transparent;
      color: var(--text-sub);
      border: 1px solid var(--border);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn:hover, .filter-btn.active {
      background: var(--accent);
      color: #0f172a;
      font-weight: 600;
      border-color: var(--accent);
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .ctrl-btn {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .ctrl-btn:hover { background: #475569; }
    
    /* Main Viewer */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 16px;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
    }
    .viewer-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .image-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-height: calc(100vh - 200px);
      overflow-y: auto;
      overflow-x: hidden;
      padding: 8px;
    }
    .image-wrapper img {
      max-width: 95%;
      max-height: 82vh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border);
      cursor: zoom-in;
      transition: transform 0.2s ease;
    }
    .image-wrapper.zoomed img {
      max-height: none;
      width: 100%;
      cursor: zoom-out;
    }
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(15, 23, 42, 0.7);
      color: white;
      border: 1px solid var(--border);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: all 0.2s;
      z-index: 10;
    }
    .nav-arrow:hover {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
      transform: translateY(-50%) scale(1.1);
    }
    .nav-prev { left: 24px; }
    .nav-next { right: 24px; }
    
    /* Caption Bar */
    .caption-bar {
      width: 100%;
      max-width: 980px;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid var(--border);
      padding: 10px 18px;
      border-radius: 8px;
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(8px);
      flex-shrink: 0;
    }
    .caption-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .caption-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--accent);
    }
    .caption-desc {
      font-size: 0.82rem;
      color: var(--text-sub);
    }
    .caption-counter {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-main);
      background: var(--bg-card);
      padding: 4px 10px;
      border-radius: 4px;
      white-space: nowrap;
    }
    
    /* Thumbnail Strip */
    footer {
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      padding: 8px 16px;
      flex-shrink: 0;
      height: 80px;
      display: flex;
      align-items: center;
      overflow-x: auto;
      gap: 8px;
    }
    footer::-webkit-scrollbar { height: 6px; }
    footer::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .thumb-item {
      height: 60px;
      min-width: 90px;
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      opacity: 0.6;
      transition: all 0.2s;
      position: relative;
    }
    .thumb-item:hover { opacity: 0.9; }
    .thumb-item.active {
      border-color: var(--accent);
      opacity: 1;
      transform: scale(1.04);
    }
    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .thumb-num {
      position: absolute;
      bottom: 2px;
      left: 2px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 1px 4px;
      border-radius: 2px;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-area">
      <div class="logo-title">
        Medi Q 시연 갤러리
        <span class="logo-badge">Azure PoC</span>
      </div>
      <div class="filters">
        <button class="filter-btn active" data-filter="all">전체 (24)</button>
        <button class="filter-btn" data-filter="patient">환자 포털 (01~07)</button>
        <button class="filter-btn" data-filter="clinician">의료진 워크스페이스 (08~18)</button>
        <button class="filter-btn" data-filter="security">보안 관제실 (19~23)</button>
        <button class="filter-btn" data-filter="infra">클라우드 인프라 (24)</button>
      </div>
    </div>
    <div class="controls">
      <button class="ctrl-btn" id="btnToggleZoom">🔍 배율 전환 (클릭)</button>
      <button class="ctrl-btn" id="btnFullscreen">⛶ 전체화면</button>
    </div>
  </header>

  <main>
    <div class="viewer-container">
      <button class="nav-arrow nav-prev" id="btnPrev" title="이전 (←)">‹</button>
      
      <div class="image-wrapper" id="imageWrapper">
        <img id="mainImage" src="./screenshots/01_시작화면_메인랜딩_역할선택.png" alt="시연 스크린샷">
      </div>
      
      <button class="nav-arrow nav-next" id="btnNext" title="다음 (→)">›</button>

      <div class="caption-bar">
        <div class="caption-info">
          <div class="caption-title" id="captionTitle">01_시작화면_메인랜딩_역할선택</div>
          <div class="caption-desc" id="captionDesc">메인 시작 화면 (환자 / 의료진 / 보안운영자 역할 선택)</div>
        </div>
        <div class="caption-counter" id="captionCounter">1 / 24</div>
      </div>
    </div>
  </main>

  <footer id="thumbStrip">
    <!-- Rendered by JS -->
  </footer>

  <script>
    const items = [

      { id: 4, role: 'patient', file: '04_환자포털_내건강지갑_홈_대시보드.png', title: '04. 환자포털 내건강지갑 홈 대시보드', desc: '최근 국가건강검진 기록 및 유효 공유동의 13건 요약 대시보드' },
      { id: 5, role: 'patient', file: '05_환자포털_AI건강도우미_검사기록비교_질의.png', title: '05. 환자포털 AI건강도우미 검사기록비교 질의', desc: '혈청 AFP 검사 질의, 이전 수치 비교 설명, KDCA 근거 기반 답변 및 가드레일' },
      { id: 6, role: 'patient', file: '06_환자포털_영상공유동의_제공병원_범위설정.png', title: '06. 환자포털 영상공유동의 제공병원 범위설정', desc: '한국병원→서울대병원 복부 CT 시리즈(700장) 및 건강검진 7일간 VIEW_ONLY 공유동의 설정' },
      { id: 7, role: 'patient', file: '07_환자포털_병원제시용_1회용_공유QR티켓_발급.png', title: '07. 환자포털 병원제시용 1회용 공유QR티켓 발급', desc: '병원 제시용 단기 1회용 암호화 QR 공유 티켓 발급 및 카운트다운 타이머' },
      { id: 8, role: 'clinician', file: '08_의료진_로그인진입.png', title: '08. 의료진 로그인진입', desc: '의료진 워크스페이스 전용 로그인 진입 안내' },
      { id: 9, role: 'clinician', file: '09_의료진_접수데스크_QR코드_스캔대기.png', title: '09. 의료진 접수데스크 QR코드 스캔대기', desc: '진료실 접수 데스크에서 환자 모바일 QR 코드 스캔 대기' },
      { id: 10, role: 'clinician', file: '10_의료진_접수데스크_환자접수목록_확인.png', title: '10. 의료진 접수데스크 환자접수목록 확인', desc: 'QR 스캔 후 홍길동 환자 접수 목록 등록 및 동의 상태(ACTIVE) 확인' },
      { id: 11, role: 'clinician', file: '11_의료진_환자기록열람_공유된건강검진결과_생체지표.png', title: '11. 의료진 환자기록열람 공유된건강검진결과 생체지표', desc: '공유 동의된 건강검진 지표(AST/ALT/혈당) 추이 차트 및 수치 열람 (HL7 FHIR)' },
      { id: 12, role: 'clinician', file: '12_의료진_환자영상_승인된_복부CT검사목록_확인.png', title: '12. 의료진 환자영상 승인된 복부CT검사목록 확인', desc: '동의된 복부 CT 검사 목록(2026-08-15) 및 모달리티 상세 확인' },
      { id: 13, role: 'clinician', file: '13_의료진_환자영상_DICOM뷰어_접근준비.png', title: '13. 의료진 환자영상 DICOM뷰어 접근준비', desc: 'MediQ Web DICOM 뷰어 호출 및 보안 세션 초기화' },
      { id: 14, role: 'clinician', file: '14_의료진_DICOM뷰어_영상접근토큰_발급대기.png', title: '14. 의료진 DICOM뷰어 영상접근토큰 발급대기', desc: 'ABAC 11개 정책 검증 후 5분 단기 DICOMweb 접근 토큰 발급 대기' },
      { id: 15, role: 'clinician', file: '15_의료진_병원보관함_PACS보관조건_설정.png', title: '15. 의료진 병원보관함 PACS보관조건 설정', desc: '본원(B병원) PACS 보관 전 보관 기한 및 조건 설정 (원격 PACS 분산 보관)' },
      { id: 16, role: 'clinician', file: '16_의료진_DICOM뷰어_복부CT_700슬라이스_스트리밍열람.png', title: '16. 의료진 DICOM뷰어 복부CT 700슬라이스 스트리밍열람', desc: '복부 CT 700슬라이스 WADO-RS 프레임 스트리밍 열람 (윈도잉, 줌/팬, 다운로드 제한)' },
      { id: 17, role: 'clinician', file: '17_의료진_병원보관함_복부CT시리즈_작업등록.png', title: '17. 의료진 병원보관함 복부CT시리즈 작업등록', desc: '복부 CT 700개 인스턴스 B-PACS 비동기 반입(Import) 작업 등록' },
      { id: 18, role: 'clinician', file: '18_의료진_병원보관함_PACS보관작업_상태상세.png', title: '18. 의료진 병원보관함 PACS보관작업 상태상세', desc: 'PACS 전송 작업 100% 완료 및 무결성(SHA-256) 검증 상태 확인' },
      { id: 19, role: 'security', file: '19_보안관리자_로그인진입.png', title: '19. 보안관리자 로그인진입', desc: '보안 관제실(Security Observatory) 전용 로그인 진입 안내' },
      { id: 20, role: 'security', file: '20_보안관리자_Microsoft_Entra_ID_계정선택.png', title: '20. 보안관리자 Microsoft Entra ID 계정선택', desc: '보안 관리자(admin@...) 특권 계정 MFA/OIDC 인증' },
      { id: 21, role: 'security', file: '21_보안관리자_Microsoft_Entra_ID_계정선택_중복.png', title: '21. 보안관리자 Microsoft Entra ID 계정선택 중복', desc: '보안 관리자 인증 확인 및 관제실 리디렉션' },
      { id: 22, role: 'security', file: '22_보안관제실_메인상황판_감사로그_실시간모니터링.png', title: '22. 보안관제실 메인상황판 감사로그 실시간모니터링', desc: 'Azure Key Vault, WAF 차단 현황, 접근정책 판정, 실시간 불가변 감사로그 관제' },
      { id: 23, role: 'security', file: '23_보안관제실_기간별_보안검토보고서_PDF출력모달.png', title: '23. 보안관제실 기간별 보안검토보고서 PDF출력모달', desc: '개인정보보호법 제29조 준수 기간별 감사보고서 및 A4 PDF 인쇄 모달' },
      { id: 24, role: 'infra', file: '24_클라우드_인프라_Azure_리소스현황.png', title: '24. 클라우드 인프라 Azure 리소스현황', desc: 'Microsoft Azure Japan East 리전 배포 인프라 및 가상 네트워크 증적' },
    ];

    let currentIndex = 0;
    let filteredIndices = items.map((_, i) => i);

    const mainImage = document.getElementById('mainImage');
    const imageWrapper = document.getElementById('imageWrapper');
    const captionTitle = document.getElementById('captionTitle');
    const captionDesc = document.getElementById('captionDesc');
    const captionCounter = document.getElementById('captionCounter');
    const thumbStrip = document.getElementById('thumbStrip');
    const filterButtons = document.querySelectorAll('.filter-btn');

    function renderThumbnails() {
      thumbStrip.innerHTML = '';
      filteredIndices.forEach((itemIdx, pos) => {
        const item = items[itemIdx];
        const div = document.createElement('div');
        div.className = `thumb-item ${itemIdx === currentIndex ? 'active' : ''}`;
        div.innerHTML = `
          <img src="./screenshots/${item.file}" alt="${item.title}">
          <span class="thumb-num">${String(item.id).padStart(2, '0')}</span>
        `;
        div.onclick = () => selectItem(itemIdx);
        thumbStrip.appendChild(div);
      });
    }

    function selectItem(index) {
      currentIndex = index;
      const item = items[index];
      mainImage.src = `./screenshots/${item.file}`;
      captionTitle.textContent = item.title;
      captionDesc.textContent = item.desc;
      
      const pos = filteredIndices.indexOf(index);
      captionCounter.textContent = `${pos + 1} / ${filteredIndices.length}`;

      document.querySelectorAll('.thumb-item').forEach((el, i) => {
        el.classList.toggle('active', filteredIndices[i] === index);
      });

      // Scroll thumbnail into view
      const activeThumb = thumbStrip.children[pos];
      if (activeThumb) {
        activeThumb.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      }

      imageWrapper.classList.remove('zoomed');
    }

    function navigate(delta) {
      const currentPos = filteredIndices.indexOf(currentIndex);
      let nextPos = currentPos + delta;
      if (nextPos < 0) nextPos = filteredIndices.length - 1;
      if (nextPos >= filteredIndices.length) nextPos = 0;
      selectItem(filteredIndices[nextPos]);
    }

    document.getElementById('btnPrev').onclick = () => navigate(-1);
    document.getElementById('btnNext').onclick = () => navigate(1);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') navigate(-1);
      if (e.key === 'ArrowRight') navigate(1);
      if (e.key === 'f' || e.key === 'F') toggleFullscreen();
    });

    imageWrapper.onclick = () => {
      imageWrapper.classList.toggle('zoomed');
    };
    document.getElementById('btnToggleZoom').onclick = () => {
      imageWrapper.classList.toggle('zoomed');
    };

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }
    document.getElementById('btnFullscreen').onclick = toggleFullscreen;

    filterButtons.forEach(btn => {
      btn.onclick = () => {
        filterButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const filter = btn.dataset.filter;
        if (filter === 'all') {
          filteredIndices = items.map((_, i) => i);
        } else {
          filteredIndices = items.map((item, i) => item.role === filter ? i : -1).filter(i => i !== -1);
        }
        renderThumbnails();
        if (!filteredIndices.includes(currentIndex)) {
          selectItem(filteredIndices[0]);
        } else {
          selectItem(currentIndex);
        }
      };
    });

    // Init
    renderThumbnails();
    selectItem(0);
  </script>
</body>
</html>
